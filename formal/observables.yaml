repo_variables:
  - repo_id: EqLt.density
    c_field: m->density
    h5_path: /meas_eqlt/density
    lean_id: DQMC.Obs.eq_density_total
    time_kind: equal_time
    spin: summed
    kind: density
    measured_as: sign_weighted_accumulator
    relation_notes:
      - density_sum_rule

  - repo_id: EqLt.density_u
    c_field: m->density_u
    h5_path: /meas_eqlt/density_u
    lean_id: DQMC.Obs.eq_density_up
    time_kind: equal_time
    spin: up
    kind: density
    measured_as: sign_weighted_accumulator

  - repo_id: EqLt.density_d
    c_field: m->density_d
    h5_path: /meas_eqlt/density_d
    lean_id: DQMC.Obs.eq_density_down
    time_kind: equal_time
    spin: down
    kind: density
    measured_as: sign_weighted_accumulator

  - repo_id: EqLt.double_occ
    c_field: m->double_occ
    h5_path: /meas_eqlt/double_occ
    lean_id: DQMC.Obs.eq_double_occupancy
    time_kind: equal_time
    spin: mixed
    kind: double_occupancy
    measured_as: sign_weighted_accumulator

  - repo_id: EqLt.g00
    c_field: m->g00
    h5_path: /meas_eqlt/g00
    lean_id: DQMC.Obs.eq_green_spin_average
    time_kind: equal_time
    spin: average_ud
    kind: green_function
    measured_as: sign_weighted_accumulator
    relation_notes:
      - g00_spin_average

  - repo_id: EqLt.g00_u
    c_field: m->g00_u
    h5_path: /meas_eqlt/g00_u
    lean_id: DQMC.Obs.eq_green_up
    time_kind: equal_time
    spin: up
    kind: green_function
    measured_as: sign_weighted_accumulator

  - repo_id: EqLt.g00_d
    c_field: m->g00_d
    h5_path: /meas_eqlt/g00_d
    lean_id: DQMC.Obs.eq_green_down
    time_kind: equal_time
    spin: down
    kind: green_function
    measured_as: sign_weighted_accumulator

  - repo_id: Uneqlt.gt0
    c_field: m->gt0
    h5_path: /meas_uneqlt/gt0
    lean_id: DQMC.Obs.uneq_green_spin_average
    time_kind: unequal_time
    spin: average_ud
    kind: green_function
    tau_dependent: true
    measured_as: sign_weighted_accumulator
    relation_notes:
      - gt0_spin_average

  - repo_id: Uneqlt.gt0_u
    c_field: m->gt0_u
    h5_path: /meas_uneqlt/gt0_u
    lean_id: DQMC.Obs.uneq_green_up
    time_kind: unequal_time
    spin: up
    kind: green_function
    tau_dependent: true
    measured_as: sign_weighted_accumulator

  - repo_id: Uneqlt.gt0_d
    c_field: m->gt0_d
    h5_path: /meas_uneqlt/gt0_d
    lean_id: DQMC.Obs.uneq_green_down
    time_kind: unequal_time
    spin: down
    kind: green_function
    tau_dependent: true
    measured_as: sign_weighted_accumulator

  - repo_id: Uneqlt.jj
    c_field: m->jj
    h5_path: /meas_uneqlt/jj
    lean_id: DQMC.Obs.raw_current_current
    time_kind: unequal_time
    kind: raw_current_current
    tau_dependent: true
    measured_as: sign_weighted_accumulator

derived_observables:
  - derived_id: Uneqlt.projected_jj
    lean_id: DQMC.Obs.projected_current_current
    input_repo_id: Uneqlt.jj
    definition_theorem: DQMC.Current.projected_jj_from_raw_jj_q0

  - derived_id: Uneqlt.JNJN
    lean_id: DQMC.Obs.elec_current_current
    input_lean_id: DQMC.Obs.projected_current_current
    definition_theorem: DQMC.Current.JNJN_eq_neg_projected_jj