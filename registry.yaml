#schema_version: 0.1
#codebase: 1band_unified_hub

# Observables measured in DQMC
observables:
  # Density
  - id: density
    aliases:
      - n
      - den
      - filling
      - particle density
      - electron density
      - fermion density
      - doping

    physics:
      definition: "Average electron occupation per site."
      formula:
        - '`n = (1/N) sum_i <n_{i,up} + n_{i,down}>`'
        - '`n = 2 - <c_{i,up} c^dagger_{i,up}> - <c_{i,down} c^dagger_{i,down}>`'

    code:
      measurement:
        file: meas.c
        function: measure_eqlt()
        variable: m->density
      generation:
        file: gen_1band_unified_hub.py
        variable: meas_eqlt/density
        flags:
          - meas_eqlt

    requirements:
      required_flags: ["period_eqlt > 0"]
      limitations: []

    normalization:
      is_sign_weighted: true
      is_per_site: true
      spin_type: sum

    units: dimensionless

    data_layout:
      type: float_or_complex
      shape: [num_i]
      index_convention: "r=map_i[i]. If trans_sym=1, r labels orbital channel; otherwise r labels site i."

  # Density up
  - id: density_up
    aliases:
      - n_up
      - den_up
      - n_u
      - den_u
      - density_u
      - spin up filling
      - spin up density
      - spin up electron density
      - spin up fermion density

    physics:
      definition: "Average spin up electron occupation per site."
      formula:
        - '`n_up = (1/N) sum_i <n_{i,up}>`'
        - '`n_up = 1 - <c_{i,up} c^dagger_{i,up}>`'

    code:
      measurement:
        file: meas.c
        function: measure_eqlt()
        variable: m->density_u
      generation:
        file: gen_1band_unified_hub.py
        variable: meas_eqlt/density_u
        flags:
          - meas_eqlt

    requirements:
      required_flags: ["period_eqlt > 0"]
      limitations: []

    normalization:
      is_sign_weighted: true
      is_per_site: true
      spin_type: up

    units: dimensionless

    data_layout:
      type: float_or_complex
      shape: [num_i]
      index_convention: "r=map_i[i]. If trans_sym=1, r labels orbital channel; otherwise r labels site i."

  # Density down
  - id: density_down
    aliases:
      - n_down
      - den_down
      - n_d
      - den_d
      - density_d
      - spin down density
      - spin down electron density
      - spin down fermion density

    physics:
      definition: "Average spin down electron occupation per site."
      formula:
        - '`n_down = (1/N) sum_i <n_{i,down}>`'
        - '`n_down = 1 - <c_{i,down} c^dagger_{i,down}>`'

    code:
      measurement:
        file: meas.c
        function: measure_eqlt()
        variable: m->density_d
      generation:
        file: gen_1band_unified_hub.py
        variable: meas_eqlt/density_d
        flags:
          - meas_eqlt

    requirements:
      required_flags: ["period_eqlt > 0"]
      limitations: []

    normalization:
      is_sign_weighted: true
      is_per_site: true
      spin_type: down

    units: dimensionless

    data_layout:
      type: float_or_complex
      shape: [num_i]
      index_convention: "r=map_i[i]. If trans_sym=1, r labels orbital channel; otherwise r labels site i."

  # Double occupancy
  - id: double_occ
    aliases: [double occupancy, doublon density, D]
    physics:
      definition: "Equal-time local double occupancy."
      formula: ['`D_i=<n_{i,up} n_{i,down}>`', '`D_i=(1-G_up(i,i))(1-G_down(i,i))`']
    code:
      measurement: {file: meas.c, function: measure_eqlt(), variable: m->double_occ}
      generation: {file: gen_1band_unified_hub.py, variable: meas_eqlt/double_occ, flags: [period_eqlt]}
    requirements:
      required_flags: ["period_eqlt > 0"]
      limitations: []
    normalization:
      is_sign_weighted: true
      hdf5_accumulator: "sum phase*D_i/degen_i"
      final_average: "double_occ/sign"
      spatial_average: "map_i with degen_i"
      spin_type: up_down_product
    units: dimensionless
    data_layout:
      type: float_or_complex
      shape: [num_i]
      index_convention: "r=map_i[i]. If trans_sym=1, r labels orbital channel; otherwise r labels site i."

  - id: g00
    aliases: [equal time Green function, g00, spin averaged Green function]
    physics:
      definition: "Equal-time spin-averaged single-particle Green function."
      formula: ['`g00(i,j)=0.5*(G_up(i,j)+G_down(i,j))`', '`With Peierls: multiply each spin channel by P_sigma(j,i).`']
    code:
      measurement: {file: meas.c, function: measure_eqlt(), variable: m->g00}
      generation: {file: gen_1band_unified_hub.py, variable: meas_eqlt/g00, flags: [period_eqlt]}
    requirements:
      required_flags: ["period_eqlt > 0"]
      limitations: []
    normalization: {is_sign_weighted: true, hdf5_accumulator: "sum phase*g00/degen_ij", final_average: "g00/sign", spatial_average: "map_ij with degen_ij", spin_type: average}
    units: dimensionless
    data_layout: {type: float_or_complex, shape: [num_ij], index_convention: "r=map_ij[i+N*j]."}

  - id: g00_u
    aliases: [g00_up, spin up equal time Green function]
    physics:
      definition: "Equal-time spin-up single-particle Green function."
      formula: ['`g00_u(i,j)=G_up(i,j)`', '`With Peierls: g00_u(i,j)=G_up(i,j)P_up(j,i).`']
    code:
      measurement: {file: meas.c, function: measure_eqlt(), variable: m->g00_u}
      generation: {file: gen_1band_unified_hub.py, variable: meas_eqlt/g00_u, flags: [period_eqlt]}
    requirements:
      required_flags: ["period_eqlt > 0"]
      limitations: []
    normalization: {is_sign_weighted: true, hdf5_accumulator: "sum phase*g00_u/degen_ij", final_average: "g00_u/sign", spatial_average: "map_ij with degen_ij", spin_type: up}
    units: dimensionless
    data_layout: {type: float_or_complex, shape: [num_ij], index_convention: "r=map_ij[i+N*j]."}

  - id: g00_d
    aliases: [g00_down, spin down equal time Green function]
    physics:
      definition: "Equal-time spin-down single-particle Green function."
      formula: ['`g00_d(i,j)=G_down(i,j)`', '`With Peierls: g00_d(i,j)=G_down(i,j)P_down(j,i).`']
    code:
      measurement: {file: meas.c, function: measure_eqlt(), variable: m->g00_d}
      generation: {file: gen_1band_unified_hub.py, variable: meas_eqlt/g00_d, flags: [period_eqlt]}
    requirements:
      required_flags: ["period_eqlt > 0"]
      limitations: []
    normalization: {is_sign_weighted: true, hdf5_accumulator: "sum phase*g00_d/degen_ij", final_average: "g00_d/sign", spatial_average: "map_ij with degen_ij", spin_type: down}
    units: dimensionless
    data_layout: {type: float_or_complex, shape: [num_ij], index_convention: "r=map_ij[i+N*j]."}

  - id: nn_eqlt
    aliases: [nn, equal time density density correlation, charge correlation]
    physics:
      definition: "Equal-time full density-density correlation; disconnected part is not subtracted."
      formula: ['`C_nn(i,j)=<n_i n_j>`']
    code:
      measurement: {file: meas.c, function: measure_eqlt(), variable: m->nn}
      generation: {file: gen_1band_unified_hub.py, variable: meas_eqlt/nn, flags: [period_eqlt]}
    requirements:
      required_flags: ["period_eqlt > 0"]
      limitations: []
    normalization: {is_sign_weighted: true, hdf5_accumulator: "sum phase*C_nn/degen_ij", final_average: "nn/sign", spatial_average: "map_ij with degen_ij", spin_type: sum}
    units: dimensionless
    data_layout: {type: float_or_complex, shape: [num_ij], index_convention: "r=map_ij[i+N*j]."}

  - id: xx_eqlt
    aliases: [xx, equal time transverse spin correlation, SxSx]
    physics:
      definition: "Equal-time transverse spin correlation block."
      formula: ['`C_xx=1/4*(delta_ij*(G_up(ii)+G_down(ii))-(G_up(ji)G_down(ij)+G_down(ji)G_up(ij)))`']
    code:
      measurement: {file: meas.c, function: measure_eqlt(), variable: m->xx}
      generation: {file: gen_1band_unified_hub.py, variable: meas_eqlt/xx, flags: [period_eqlt]}
    requirements:
      required_flags: ["period_eqlt > 0"]
      limitations: []
    normalization: {is_sign_weighted: true, hdf5_accumulator: "sum phase*C_xx/degen_ij", final_average: "xx/sign", spatial_average: "map_ij with degen_ij", spin_type: transverse}
    units: dimensionless
    data_layout: {type: float_or_complex, shape: [num_ij], index_convention: "r=map_ij[i+N*j]."}

  - id: zz_eqlt
    aliases: [zz, equal time longitudinal spin correlation, SzSz]
    physics:
      definition: "Equal-time longitudinal spin correlation."
      formula: ['`C_zz=<S^z_i S^z_j>`']
    code:
      measurement: {file: meas.c, function: measure_eqlt(), variable: m->zz}
      generation: {file: gen_1band_unified_hub.py, variable: meas_eqlt/zz, flags: [period_eqlt]}
    requirements:
      required_flags: ["period_eqlt > 0"]
      limitations: []
    normalization: {is_sign_weighted: true, hdf5_accumulator: "sum phase*C_zz/degen_ij", final_average: "zz/sign", spatial_average: "map_ij with degen_ij", spin_type: longitudinal}
    units: dimensionless
    data_layout: {type: float_or_complex, shape: [num_ij], index_convention: "r=map_ij[i+N*j]."}

  - id: pair_sw_eqlt
    aliases: [pair_sw, onsite s wave pair correlation]
    physics:
      definition: "Equal-time onsite s-wave pair correlation."
      formula: ['`Delta_i=c_{i,down}c_{i,up}`', '`C_pair_sw(i,j)=G_up(i,j)G_down(i,j)`']
    code:
      measurement: {file: meas.c, function: measure_eqlt(), variable: m->pair_sw}
      generation: {file: gen_1band_unified_hub.py, variable: meas_eqlt/pair_sw, flags: [period_eqlt]}
    requirements:
      required_flags: ["period_eqlt > 0"]
      limitations: []
    normalization: {is_sign_weighted: true, hdf5_accumulator: "sum phase*C_pair_sw/degen_ij", final_average: "pair_sw/sign", spatial_average: "map_ij with degen_ij", spin_type: singlet_pair}
    units: dimensionless
    data_layout: {type: float_or_complex, shape: [num_ij], index_convention: "r=map_ij[i+N*j]."}

  - id: uuuu_eqlt
    aliases: [uuuu, equal time up up generalized susceptibility block]
    physics: {definition: "Equal-time up-up particle-hole bilinear building block.", formula: ['`(delta_i1j2-G_up(j2,i1))*G_up(j1,i2)`']}
    code:
      measurement: {file: meas.c, function: measure_eqlt(), variable: m->uuuu}
      generation: {file: gen_1band_unified_hub.py, variable: meas_eqlt/uuuu, flags: [meas_gen_suscept]}
    requirements: {required_flags: ["period_eqlt > 0", "meas_gen_suscept = 1", "trans_sym = 1"], limitations: ["Generator raises ValueError if meas_gen_suscept is enabled without trans_sym."]}
    normalization: {is_sign_weighted: true, hdf5_accumulator: "sum phase*block/(Nx*Ny*Nx*Ny)", final_average: "uuuu/sign", spatial_average: "two map_ij channels", spin_type: up_up}
    units: dimensionless
    data_layout: {type: float_or_complex, shape: [num_ij_times_num_ij], index_convention: "r=k1+num_ij*k2, k1=map_ij[i1+N*j2], k2=map_ij[i2+N*j1]."}

  - id: dddd_eqlt
    aliases: [dddd, equal time down down generalized susceptibility block]
    physics: {definition: "Equal-time down-down particle-hole bilinear building block.", formula: ['`(delta_i1j2-G_down(j2,i1))*G_down(j1,i2)`']}
    code:
      measurement: {file: meas.c, function: measure_eqlt(), variable: m->dddd}
      generation: {file: gen_1band_unified_hub.py, variable: meas_eqlt/dddd, flags: [meas_gen_suscept]}
    requirements: {required_flags: ["period_eqlt > 0", "meas_gen_suscept = 1", "trans_sym = 1"], limitations: ["Generator raises ValueError if meas_gen_suscept is enabled without trans_sym."]}
    normalization: {is_sign_weighted: true, hdf5_accumulator: "sum phase*block/(Nx*Ny*Nx*Ny)", final_average: "dddd/sign", spatial_average: "two map_ij channels", spin_type: down_down}
    units: dimensionless
    data_layout: {type: float_or_complex, shape: [num_ij_times_num_ij], index_convention: "r=k1+num_ij*k2, k1=map_ij[i1+N*j2], k2=map_ij[i2+N*j1]."}

  - id: uudd_eqlt
    aliases: [uudd, equal time up down generalized susceptibility block]
    physics: {definition: "Equal-time up-down particle-hole bilinear building block.", formula: ['`(delta_i1j2-G_up(j2,i1))*G_down(j1,i2)`']}
    code:
      measurement: {file: meas.c, function: measure_eqlt(), variable: m->uudd}
      generation: {file: gen_1band_unified_hub.py, variable: meas_eqlt/uudd, flags: [meas_gen_suscept]}
    requirements: {required_flags: ["period_eqlt > 0", "meas_gen_suscept = 1", "trans_sym = 1"], limitations: ["Generator raises ValueError if meas_gen_suscept is enabled without trans_sym."]}
    normalization: {is_sign_weighted: true, hdf5_accumulator: "sum phase*block/(Nx*Ny*Nx*Ny)", final_average: "uudd/sign", spatial_average: "two map_ij channels", spin_type: up_down}
    units: dimensionless
    data_layout: {type: float_or_complex, shape: [num_ij_times_num_ij], index_convention: "r=k1+num_ij*k2, k1=map_ij[i1+N*j2], k2=map_ij[i2+N*j1]."}

  - id: dduu_eqlt
    aliases: [dduu, equal time down up generalized susceptibility block]
    physics: {definition: "Equal-time down-up particle-hole bilinear building block.", formula: ['`(delta_i1j2-G_down(j2,i1))*G_up(j1,i2)`']}
    code:
      measurement: {file: meas.c, function: measure_eqlt(), variable: m->dduu}
      generation: {file: gen_1band_unified_hub.py, variable: meas_eqlt/dduu, flags: [meas_gen_suscept]}
    requirements: {required_flags: ["period_eqlt > 0", "meas_gen_suscept = 1", "trans_sym = 1"], limitations: ["Generator raises ValueError if meas_gen_suscept is enabled without trans_sym."]}
    normalization: {is_sign_weighted: true, hdf5_accumulator: "sum phase*block/(Nx*Ny*Nx*Ny)", final_average: "dduu/sign", spatial_average: "two map_ij channels", spin_type: down_up}
    units: dimensionless
    data_layout: {type: float_or_complex, shape: [num_ij_times_num_ij], index_convention: "r=k1+num_ij*k2, k1=map_ij[i1+N*j2], k2=map_ij[i2+N*j1]."}

  - id: chi
    aliases: [scalar spin chirality, plaquette chirality, loop current chirality]
    physics: {definition: "Equal-time plaquette chirality or loop-current type three-site Wick contraction.", formula: ['`Computed from plaqs[0:3,a] using the Wick-expanded expression in measure_eqlt().`']}
    code:
      measurement: {file: meas.c, function: measure_eqlt(), variable: m->chi}
      generation: {file: gen_1band_unified_hub.py, variable: meas_eqlt/chi, flags: [meas_chiral]}
    requirements: {required_flags: ["period_eqlt > 0", "meas_chiral = 1"], limitations: []}
    normalization: {is_sign_weighted: true, hdf5_accumulator: "sum phase*chi_a/degen_plaq", final_average: "chi/sign", spatial_average: "map_plaq with degen_plaq", spin_type: mixed}
    units: dimensionless
    data_layout: {type: float_or_complex, shape: [num_plaq_accum], index_convention: "r=map_plaq[a]; plaquette sites are plaqs[0,a], plaqs[1,a], plaqs[2,a]."}

  - id: kk_eqlt
    aliases: [kk, equal time kinetic kinetic correlation]
    physics: {definition: "Equal-time 1-bond kinetic to 1-bond kinetic correlation building block.", formula: ['`<K_b K_c> Wick contraction.`']}
    code:
      measurement: {file: meas.c, function: measure_eqlt(), variable: m->kk}
      generation: {file: gen_1band_unified_hub.py, variable: meas_eqlt/kk, flags: [meas_energy_corr]}
    requirements: {required_flags: ["period_eqlt > 0", "meas_energy_corr = 1"], limitations: []}
    normalization: {is_sign_weighted: true, hdf5_accumulator: "sum phase*kk/degen_bb", final_average: "kk/sign", spatial_average: "map_bb with degen_bb", spin_type: sum}
    units: dimensionless_operator_block
    data_layout: {type: float_or_complex, shape: [num_bb], index_convention: "r=map_bb[b+num_b*c]."}

  - id: kv_eqlt
    aliases: [kv, equal time kinetic interaction correlation]
    physics: {definition: "Equal-time 1-bond kinetic to onsite interaction/double-occupancy correlation building block.", formula: ['`<K_b V_j> Wick contraction.`']}
    code:
      measurement: {file: meas.c, function: measure_eqlt(), variable: m->kv}
      generation: {file: gen_1band_unified_hub.py, variable: meas_eqlt/kv, flags: [meas_energy_corr]}
    requirements: {required_flags: ["period_eqlt > 0", "meas_energy_corr = 1"], limitations: []}
    normalization: {is_sign_weighted: true, hdf5_accumulator: "sum phase*kv/degen_bs", final_average: "kv/sign", spatial_average: "map_bs with degen_bs", spin_type: sum}
    units: dimensionless_operator_block
    data_layout: {type: float_or_complex, shape: [num_bs], index_convention: "r=map_bs[b+num_b*j]."}

  - id: kn_eqlt
    aliases: [kn, equal time kinetic density correlation]
    physics: {definition: "Equal-time 1-bond kinetic to density correlation building block.", formula: ['`<K_b n_j> Wick contraction.`']}
    code:
      measurement: {file: meas.c, function: measure_eqlt(), variable: m->kn}
      generation: {file: gen_1band_unified_hub.py, variable: meas_eqlt/kn, flags: [meas_energy_corr]}
    requirements: {required_flags: ["period_eqlt > 0", "meas_energy_corr = 1"], limitations: []}
    normalization: {is_sign_weighted: true, hdf5_accumulator: "sum phase*kn/degen_bs", final_average: "kn/sign", spatial_average: "map_bs with degen_bs", spin_type: sum}
    units: dimensionless_operator_block
    data_layout: {type: float_or_complex, shape: [num_bs], index_convention: "r=map_bs[b+num_b*j]."}

  - id: vv_eqlt
    aliases: [vv, equal time interaction interaction correlation]
    physics: {definition: "Equal-time onsite interaction/double-occupancy to onsite interaction/double-occupancy correlation building block.", formula: ['`<n_up_i n_down_i n_up_j n_down_j> Wick block.`']}
    code:
      measurement: {file: meas.c, function: measure_eqlt(), variable: m->vv}
      generation: {file: gen_1band_unified_hub.py, variable: meas_eqlt/vv, flags: [meas_energy_corr]}
    requirements: {required_flags: ["period_eqlt > 0", "meas_energy_corr = 1"], limitations: []}
    normalization: {is_sign_weighted: true, hdf5_accumulator: "sum phase*vv/degen_ij", final_average: "vv/sign", spatial_average: "map_ij with degen_ij", spin_type: up_down_product}
    units: dimensionless_operator_block
    data_layout: {type: float_or_complex, shape: [num_ij], index_convention: "r=map_ij[i+N*j]."}

  - id: vn_eqlt
    aliases: [vn, equal time interaction density correlation]
    physics: {definition: "Equal-time onsite interaction/double-occupancy to density correlation building block.", formula: ['`<V_i n_j> Wick block.`']}
    code:
      measurement: {file: meas.c, function: measure_eqlt(), variable: m->vn}
      generation: {file: gen_1band_unified_hub.py, variable: meas_eqlt/vn, flags: [meas_energy_corr]}
    requirements: {required_flags: ["period_eqlt > 0", "meas_energy_corr = 1"], limitations: []}
    normalization: {is_sign_weighted: true, hdf5_accumulator: "sum phase*vn/degen_ij", final_average: "vn/sign", spatial_average: "map_ij with degen_ij", spin_type: sum}
    units: dimensionless_operator_block
    data_layout: {type: float_or_complex, shape: [num_ij], index_convention: "r=map_ij[i+N*j]."}

  - id: j
    aliases: [local current, bond current]
    physics: {definition: "Equal-time local 1-bond current building block.", formula: ['`Antisymmetric bond bilinear summed over spin with Peierls phases.`']}
    code:
      measurement: {file: meas.c, function: measure_eqlt(), variable: m->j}
      generation: {file: gen_1band_unified_hub.py, variable: meas_eqlt/j, flags: [meas_local_JQ]}
    requirements: {required_flags: ["period_eqlt > 0", "meas_local_JQ = 1", "trans_sym = 0"], limitations: ["Generator asserts trans_sym == 0."]}
    normalization: {is_sign_weighted: true, hdf5_accumulator: "sum phase*j/degen_b", final_average: "j/sign", spatial_average: "map_b with degen_b", spin_type: sum}
    units: dimensionless_current_block
    data_layout: {type: float_or_complex, shape: [num_b], index_convention: "r=map_b[c], endpoints bonds[0,c] and bonds[1,c]."}

  - id: jn
    aliases: [density dressed current, local jn]
    physics: {definition: "Equal-time density-dressed 1-bond current building block.", formula: ['`Wick contraction of a 1-bond current dressed by endpoint densities.`']}
    code:
      measurement: {file: meas.c, function: measure_eqlt(), variable: m->jn}
      generation: {file: gen_1band_unified_hub.py, variable: meas_eqlt/jn, flags: [meas_local_JQ]}
    requirements: {required_flags: ["period_eqlt > 0", "meas_local_JQ = 1", "trans_sym = 0"], limitations: ["Generator asserts trans_sym == 0."]}
    normalization: {is_sign_weighted: true, hdf5_accumulator: "sum phase*jn/degen_b", final_average: "jn/sign", spatial_average: "map_b with degen_b", spin_type: mixed}
    units: dimensionless_current_block
    data_layout: {type: float_or_complex, shape: [num_b], index_convention: "r=map_b[c], endpoints bonds[0,c] and bonds[1,c]."}

  - id: j2
    aliases: [two hop current, local j2]
    physics: {definition: "Equal-time 2-hop current building block.", formula: ['`Antisymmetric 2-hop bilinear using pp_u, pp_d, ppr_u, and ppr_d path phases.`']}
    code:
      measurement: {file: meas.c, function: measure_eqlt(), variable: m->j2}
      generation: {file: gen_1band_unified_hub.py, variable: meas_eqlt/j2, flags: [meas_local_JQ]}
    requirements: {required_flags: ["period_eqlt > 0", "meas_local_JQ = 1", "trans_sym = 0"], limitations: ["Generator asserts trans_sym == 0."]}
    normalization: {is_sign_weighted: true, hdf5_accumulator: "sum phase*j2/degen_b2", final_average: "j2/sign", spatial_average: "map_b2 with degen_b2", spin_type: sum}
    units: dimensionless_current_block
    data_layout: {type: float_or_complex, shape: [num_b2], index_convention: "r=map_b2[c], endpoints bond2s[0,c] and bond2s[1,c]."}

  - id: gt0
    aliases: [unequal time Green function, gt0, spin averaged unequal time Green function]
    physics: {definition: "Unequal-time spin-averaged single-particle Green function.", formula: ['`gt0(i,j,t)=0.5*(G_up(t,0;i,j)+G_down(t,0;i,j))`', '`With Peierls: multiply each spin channel by P_sigma(j,i).`']}
    code:
      measurement: {file: meas.c, function: measure_uneqlt(), variable: m->gt0}
      generation: {file: gen_1band_unified_hub.py, variable: meas_uneqlt/gt0, flags: [period_uneqlt]}
    requirements: {required_flags: ["period_uneqlt > 0"], limitations: []}
